name: Build TelegramCh CoExist (Chinese)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Rust
        run: |
          RUST_VERSION=$(grep '^version.rust=' version.properties | cut -d= -f2)
          echo "Installing Rust $RUST_VERSION"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION" --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;30.0.16248370 cmake;3.22.1"

      - name: Download sing-box core
        run: |
          SINGBOX_VERSION=$(grep '^version.singbox=' version.properties 2>/dev/null | cut -d= -f2 || true)
          [ -z "$SINGBOX_VERSION" ] && SINGBOX_VERSION=1.14.4
          echo "Downloading sing-box $SINGBOX_VERSION"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sL -o /tmp/singbox.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-android-arm64.tar.gz"
          tar -xzf /tmp/singbox.tar.gz -C /tmp
          cp "/tmp/sing-box-${SINGBOX_VERSION}-android-arm64/sing-box" app/src/main/jniLibs/arm64-v8a/libsingbox.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libsingbox.so

      - name: Configure local.properties
        shell: bash
        run: |
          RUST_HOME=$(rustup show home)
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "rust.dir=${RUST_HOME}"
            echo "telegram.api_id=94575"
            echo "telegram.api_hash=a3406de8d171bb422bb6ddf3bbd800e2"
            echo "app.id=com.telegramch.coexist"
            echo "app.name=TelegramCh CoExist"
            echo "app.download_url=https://telegram.org/dlx"
            echo "tgx.extension=none"
            echo "app.disable_signing=true"
            echo "app.experimental=true"
          } > local.properties
          cat local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate git setup
        run: ./gradlew :app:validateGitSetup --no-daemon --stacktrace

      - name: Build debug APK (arm64)
        run: ./gradlew :app:assembleLatestDebug -Pabi=arm64 --no-daemon --stacktrace
        env:
          JAVA_TOOLCHAIN_REQUESTS_TIMEOUT: 120

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCh-CoExist-debug
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          compression-level: 0
